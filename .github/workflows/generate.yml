name: Generate map

on:
  workflow_dispatch:
    inputs:
      road:
        description: "Route (RN1, RN4...)"
        default: "RN1"
        required: true
      km_from:
        description: "Km de debut"
        default: "0"
        required: true
      km_to:
        description: "Km de fin (250 = toute la route disponible, max ~200 km pour la RN1)"
        default: "250"
        required: true
      corridor:
        description: "Rayon des donnees OSM autour de la route (m)"
        default: "320"
      grass:
        description: "Densite d'herbe (1 = dense, 0.5 = moitie, 2 = tres dense)"
        default: "1.0"
      collision_m:
        description: "Collision au sol : distance de chaque cote de la route (m). Au-dela le relief reste visible mais sans collision (moins de memoire, ideal 2-4 Go). 0 = tout le sol"
        default: "60"
      blender:
        description: "Produire aussi le glTF Blender (inutile pour le jeu, plus long)"
        type: boolean
        default: false
      start_lat:
        description: "Optionnel : latitude du km 0"
        default: ""
      start_lon:
        description: "Optionnel : longitude du km 0"
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          touch run.log
          pip install -r requirements.txt 2>&1 | tail -3 | tee -a run.log
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Download OSM (Geofabrik) + terrain
        run: |
          EXTRA=""
          if [ -n "${{ inputs.start_lat }}" ] && [ -n "${{ inputs.start_lon }}" ]; then EXTRA="--start-lat ${{ inputs.start_lat }} --start-lon ${{ inputs.start_lon }}"; fi
          python scripts/fetch_osm_dem.py --road "${{ inputs.road }}" --km-from "${{ inputs.km_from }}" --km-to "${{ inputs.km_to }}" --corridor "${{ inputs.corridor }}" $EXTRA --out work 2>&1 | tee -a run.log

      - name: Textures
        run: python scripts/textures.py work/tex 1024 2>&1 | tee -a run.log

      - name: Geometry (terrain, road, houses, villages, equipment, vegetation)
        run: python scripts/make_geometry.py --work work --grass "${{ inputs.grass }}" 2>&1 | tee -a run.log

      - name: Export RSMG (native game format, single zip)
        run: COLLISION_M="${{ inputs.collision_m }}" python scripts/export_rsmg.py 2>&1 | tee -a run.log

      - name: Cache Blender
        if: inputs.blender
        id: bcache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-4.2.3

      - name: Install Blender
        if: inputs.blender && steps.bcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1
          mkdir -p .blender
          F=blender-4.2.3-linux-x64.tar.xz
          for BASE in https://download.blender.org/release https://mirrors.ocf.berkeley.edu/blender/release https://ftp.nluug.nl/pub/graphics/blender/release; do
            rm -f blender.tar.xz
            curl -fL --retry 3 --max-time 900 -o blender.tar.xz "$BASE/Blender4.2/$F" || continue
            if xz -t blender.tar.xz 2>/dev/null; then OK=1; break; fi
          done
          [ "${OK:-0}" = "1" ] || { echo "Blender introuvable"; exit 1; }
          tar -xf blender.tar.xz -C .blender --strip-components=1
          rm blender.tar.xz

      - name: Blender glTF (optional)
        if: inputs.blender
        run: |
          .blender/blender -b --factory-startup -noaudio -P scripts/blender_build.py -- --work work --out out --compress safe 2>&1 | tee -a run.log
          python scripts/package.py 2>&1 | tee -a run.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-${{ inputs.road }}-km${{ inputs.km_from }}-${{ inputs.km_to }}
          path: dist/*
          compression-level: 0

      - name: Release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.road }}-km${{ inputs.km_from }}-${{ inputs.km_to }}-r${{ github.run_number }}"
          gh release create "$TAG" dist/* --title "$TAG" --notes "Carte RSMG generee automatiquement (OpenStreetMap + Copernicus DEM). A extraire dans /sdcard/ (le zip contient deja RSMG/maps/...)."

      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/lg && tail -n 500 run.log > /tmp/lg/run.log || true
          cd /tmp/lg && git init -q -b logs && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log ${{ github.run_id }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs || true
